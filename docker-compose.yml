version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: workwave-mysql
    environment:
      MYSQL_DATABASE: workwave
      MYSQL_USER: workwave_user
      MYSQL_PASSWORD: workwave_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.0-alpine
    container_name: workwave-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
